name: Publish verified Beta 2 and preserve Beta 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out preserved root
        uses: actions/checkout@v4
        with:
          ref: c8ce3353e5aaa3903546f3fc3e268bee0eb7546f
          path: baseline-source

      - name: Check out frozen Beta 1
        uses: actions/checkout@v4
        with:
          ref: 259aeb8613106c2b022f64e5b36f924d4efcbaa6
          path: beta1-source

      - name: Check out Beta 2 source archive
        uses: actions/checkout@v4
        with:
          ref: 28d3ee16e3a59085c9aeab9a7d55749a688b2e90
          path: beta2-bundle

      - name: Check out verified Beta 2 update
        uses: actions/checkout@v4
        with:
          ref: 7c90549a922eb304a4d8ec87e6dac356f3eca7ac
          path: beta2-fixes-bundle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore and verify Beta 2 source and assets
        run: node beta2-bundle/restore-beta2.mjs beta2-source

      - name: Apply and verify Beta 2 scene, combat and map fixes
        run: node beta2-fixes-bundle/releases/beta2-bugfix-20261106b/restore-beta2-bugfix.mjs beta2-source

      - name: Build preserved root
        working-directory: baseline-source
        run: |
          npm ci
          npm run build

      - name: Build frozen Beta 1
        working-directory: beta1-source
        run: |
          npm ci
          npm run build

      - name: Build Beta 2
        working-directory: beta2-source
        run: |
          npm ci
          npm run build

      - name: Package all versions and verify preservation
        run: node beta2-source/scripts/package-beta-release.mjs baseline-source/dist beta1-source/dist beta2-source/dist _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
