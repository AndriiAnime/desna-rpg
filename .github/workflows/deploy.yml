# Reviewed campaign revision 3: 190 runtime/source files verified against local build.
# The root checkout remains the existing Alpha 2 source; no game source is replaced on main.
name: Deploy Alpha 2 and UI alternative to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out preserved root
        uses: actions/checkout@v4
      - name: Check out reviewed alternative
        uses: actions/checkout@v4
        with:
          ref: 73fefaffa53e96039aa7e48ece2e48ba6f1f79f0
          path: alternative-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            alternative-source/package-lock.json
      - name: Install baseline dependencies
        run: npm ci
      - name: Test baseline
        run: npm test
      - name: Build baseline
        run: npm run build
      - name: Install alternative dependencies
        working-directory: alternative-source
        run: npm ci
      - name: Test alternative
        working-directory: alternative-source
        run: npm test
      - name: Build alternative
        working-directory: alternative-source
        run: npm run build
      - name: Package both versions and UI Kit
        run: node alternative-source/scripts/package-pages.mjs dist alternative-source/dist _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
