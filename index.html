<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101c20" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101c20'/%3E%3Cpath d='M5 23l7-14h8l7 14M3 24h26M10 16h12' stroke='%23d1b67a' fill='none' stroke-width='2'/%3E%3C/svg%3E" />
    <meta
      name="description"
      content="Прах над Десною — невелика пригода за мотивами фольклору Чернігівського Полісся."
    />
    <title>Невідспівані: Прах над Десною</title>
  </head>
  <body class="immersive-build">
    <main id="app">
      <section
        id="title-screen"
        class="start-screen"
        data-title-variant="unmourned"
        aria-labelledby="game-title"
      >
        <div class="start-screen__art" aria-hidden="true"></div>
        <nav class="title-language" aria-label="Мова / Language"><button type="button" data-language="uk" aria-pressed="true">УКР</button><span aria-hidden="true">/</span><button type="button" data-language="en" aria-pressed="false">ENG</button></nav>
        <div class="start-screen__content">
          <h1 id="game-title" class="start-screen__title">Невідспівані</h1>
          <p class="start-screen__subtitle">Прах над Десною</p>
          <button id="start-button" class="start-screen__start" type="button" disabled>
            <span>Готуємо стежку…</span><span class="start-screen__arrow" aria-hidden="true">›</span>
          </button>
          <p class="title-hint start-screen__hint" aria-live="polite"></p>
        </div>
        <footer class="start-screen__footer">
          <div class="start-screen__variants" role="group" aria-label="Варіант назви гри">
            <button type="button" data-title-option="unmourned" aria-pressed="true">Невідспівані</button>
            <span aria-hidden="true">/</span>
            <button type="button" data-title-option="rebirth" aria-pressed="false">Друге народження богів</button>
          </div>
          <a class="start-screen__review" href="./ui-lab.html" data-lab-link data-copy="lab">Майстерня UI ↗</a>
        </footer>
      </section>

      <section id="game-screen" class="game-screen immersive-game" hidden aria-label="Ігрова карта">
        <div id="exploration-view" class="world-scene">
          <div id="game-canvas" tabindex="0" role="img" aria-label="Лісова галявина. Рухайтесь стрілками, WASD або натисніть на стежку."></div>
          <header class="world-hud">
            <div class="day-phase" aria-label="Фаза дня: день"><span class="day-phase__orb" aria-hidden="true"></span><div><small data-copy="phase">ФАЗА ДНЯ</small><strong data-copy="day">День</strong></div></div>
            <div class="world-location"><div><small data-copy="chapter">ЧЕРНІГІВСЬКЕ ПОЛІССЯ</small><strong data-copy="location">Наддеснянська галявина</strong></div><button id="audio-toggle" class="hud-circle audio-toggle" type="button" aria-label="Вимкнути музику" aria-pressed="true"><span aria-hidden="true">◖))</span></button></div>
          </header>
          <p id="walk-feedback" class="world-feedback" role="status" aria-live="polite"></p>
          <div class="world-controls">
            <div class="dpad" role="group" aria-label="Рух персонажа">
              <button data-direction="up-left" aria-label="Рух угору ліворуч">↖</button>
              <button data-direction="up" aria-label="Рух угору">↑</button>
              <button data-direction="up-right" aria-label="Рух угору праворуч">↗</button>
              <button data-direction="left" aria-label="Рух ліворуч">←</button>
              <span class="dpad-center" aria-hidden="true">✦</span>
              <button data-direction="right" aria-label="Рух праворуч">→</button>
              <button data-direction="down-left" aria-label="Рух униз ліворуч">↙</button>
              <button data-direction="down" aria-label="Рух униз">↓</button>
              <button data-direction="down-right" aria-label="Рух униз праворуч">↘</button>
            </div>
            <div class="world-utilities"><button id="help-button" class="hud-circle" type="button" aria-label="Як грати">?</button><button id="menu-button" class="hud-circle" type="button" aria-label="Меню гри">☰</button></div>
          </div>
        </div>
        <section id="battle-host" hidden aria-label="Бій біля переправи"></section>
        <dialog id="pause-dialog" class="scene-menu" aria-labelledby="menu-title">
          <p class="eyebrow" data-copy="pause">ПАУЗА</p><h2 id="menu-title" data-copy="journey">Подорож</h2>
          <p class="objective">Камінь перекрив коротку стежку. Знайди обхід нижньою дорогою та підійди до Блуда біля мосту.</p>
          <p id="step-count">Кроків: 0</p>
          <button id="resume-button" class="scene-menu__primary" type="button" data-copy="resume">Продовжити</button>
          <button id="journal-button" type="button" data-copy="howTo">Як грати</button>
          <button id="restart-walk" type="button" data-copy="restart">Почати заново</button>
          <a href="./ui-lab.html" data-lab-link data-copy="lab">Майстерня UI</a>
          <a href="#" id="home-link" data-copy="home">На головну</a>
        </dialog>
      </section>
      <dialog id="story-dialog" aria-labelledby="dialog-title">
        <div class="dialog-layout">
          <div id="dialog-speaker" class="dialog-speaker" hidden>
            <img src="/assets/moth-narrator-v1.png" alt="" width="180" height="180" />
            <div><strong data-narrator-name>Метелик</strong><span id="narrator-role">Твій оповідач</span></div>
          </div>
          <div class="dialog-content">
            <div id="dialog-ornament" class="dialog-ornament" aria-hidden="true">✦</div>
            <p id="dialog-eyebrow" class="eyebrow"></p>
            <span id="dialog-count" class="dialog-count"></span>
            <h2 id="dialog-title"></h2>
            <div id="dialog-body"></div>
            <button id="dialog-close" class="primary-button">
              Продовжити <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </dialog>
      <p id="status" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
